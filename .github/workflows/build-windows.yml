name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      # Produces dist/MatchVehicleAI/ (a folder, not a single .exe) -- see the
      # header of tools/windows.spec for why onefile is the wrong shape here.
      - name: Build executable
        run: pyinstaller tools/windows.spec --noconfirm

      # The app imports torch, ultralytics, easyocr and cv2 lazily, so a
      # missing dependency would not surface until a user actually starts
      # processing. Force each one to import now, while we can still fail
      # the build, rather than shipping a package that only breaks in use.
      - name: Verify bundled dependencies
        run: dist/MatchVehicleAI/MatchVehicleAI.exe --selftest

      - name: Package
        run: Compress-Archive -Path dist/MatchVehicleAI -DestinationPath MatchVehicleAI-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchVehicleAI-windows
          path: MatchVehicleAI-windows.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MatchVehicleAI-windows.zip
