name: Build Windows executables

# Two artifacts per run, built from one pinned environment
# (requirements-lock.txt + Python 3.14):
#
#   MatchVehicleAI-windows.zip      -- CPU-only torch; runs anywhere. Plain zip;
#                                      small enough not to care about format.
#   MatchVehicleAI-windows-cuda.7z  -- torch+cu126 wheels; GPU-accelerated
#                                      detection/embedding/OCR on any NVIDIA
#                                      driver >= 527.41 (CUDA-12 minor-version
#                                      compatibility), falls back to CPU code
#                                      paths otherwise. Roughly double the
#                                      download size because the CUDA DLLs are
#                                      bundled.
#
# Why the CUDA bundle is a single .7z and not a zip: GitHub caps every release
# asset at 2 GiB per file, and a plain zip of the CUDA tree is ~2.7 GiB -- it
# had to be byte-split into .zip.1/.zip.2 parts that users rejoined with
# "copy /b". 7z/LZMA2 (-mx=9, solid) compresses the highly repetitive cudnn /
# cublas DLLs far better than Deflate and lands the whole bundle under the cap
# as exactly ONE downloadable file. Extracting needs Windows 11 File Explorer
# (native .7z support), 7-Zip or WinRAR -- documented in the README.
#
# The app picks CUDA up on its own when torch reports it available, so the two
# builds differ only in which torch wheel went in -- same spec, same code.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release-attach step below creates a release and uploads assets to it,
# which needs contents:write -- the default token on push events is
# read-only, so without this the attach step dies with 403 "Resource not
# accessible by integration" (as v1.0.0's first build did).
permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"
  TORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  # Newest CUDA-12 wheel line: runs on driver >= 527.41. (+cu130 would need a
  # CUDA-13 driver, ~580.xx -- far too new to demand from users.)
  CUDA_TORCH_INDEX: "https://download.pytorch.org/whl/cu126"

jobs:
  build:
    name: PyInstaller (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            # Default PyPI Windows wheels are CPU-only -- no extra index needed.
            torch_packages: "torch==2.13.0 torchvision==0.28.0"
            torch_index_args: ""
            suffix: "-windows"
            archive: "MatchVehicleAI-windows.zip"
          - flavor: cuda
            torch_packages: "torch==2.13.0+cu126 torchvision==0.28.0+cu126"
            torch_index_args: "--index-url https://download.pytorch.org/whl/cu126"
            suffix: "-windows-cuda"
            archive: "MatchVehicleAI-windows-cuda.7z"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Torch first, from its own index for the CUDA leg, so that installing
      # requirements-lock.txt afterwards sees torch/torchvision already
      # satisfied instead of pulling the CPU wheels as easyocr dependencies.
      - name: Install torch stack (${{ matrix.flavor }})
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.torch_packages }} ${{ matrix.torch_index_args }}

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      # Baked into the bundle as assets/_build_version.txt and read back at
      # runtime (--version flag, title bar, log line). Tag builds carry the
      # tag itself; manual runs get an increasing dev number so they can still
      # be told apart.
      - name: Stamp build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "$VER" > assets/_build_version.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Produces dist/MatchVehicleAI/ (a folder, not a single .exe) -- see the
      # header of tools/windows.spec for why onefile is the wrong shape here.
      - name: Build executable
        run: pyinstaller tools/windows.spec --noconfirm

      # The app imports torch, ultralytics, easyocr and cv2 lazily, so a
      # missing dependency would not surface until a user actually starts
      # processing. Force each one to import now, while we can still fail
      # the build, rather than shipping a package that only breaks in use.
      - name: Verify bundled dependencies
        run: dist/MatchVehicleAI/MatchVehicleAI.exe --selftest

      # Proves the stamp above survived packaging -- the exe must report the
      # built version, not fall back to "dev".
      - name: Check stamped version
        shell: bash
        run: |
          OUT=$(dist/MatchVehicleAI/MatchVehicleAI.exe --version)
          echo "exe reports: $OUT"
          [[ "$OUT" == *"MatchVehicleAI $(cat assets/_build_version.txt)" ]] || {
            echo "::error::exe did not report the stamped version"; exit 1; }

      # The CPU tree zips small (~350 MB); only the CUDA leg fights the cap.
      - name: Package CPU build (zip)
        if: matrix.flavor == 'cpu'
        run: Compress-Archive -Path dist/MatchVehicleAI `
            -DestinationPath "${{ matrix.archive }}"

      # GitHub caps every release asset at 2 GiB per file and a plain zip of
      # the CUDA tree is ~2.7 GiB (the cudnn/cublas DLLs dwarf everything
      # else), so this leg archives with 7z/LZMA2 instead: -mx=9 for max
      # effort, a 256 MiB dictionary so far-apart repeats in the multi-hundred-
      # MB DLLs still match, and a solid archive with -mqs=on to sort similar
      # files adjacently. Together that lands the bundle under the cap as ONE
      # downloadable file instead of split parts users had to rejoin with
      # "copy /b". Extracting needs Win11 File Explorer / 7-Zip / WinRAR.
      #
      # Safety net: if dependency growth ever pushes the .7z back over the cap,
      # byte-split it like before rather than failing the release -- with a
      # loud warning so the regression gets noticed. The parts rejoin with
      # "copy /b ...cuda.7z.1+...cuda.7z.2 ...cuda.7z".
      - name: Package CUDA build (single-file 7z under the 2 GiB asset cap)
        if: matrix.flavor == 'cuda'
        shell: bash
        run: |
          ARCHIVE="${{ matrix.archive }}"
          7z a -t7z -mx=9 -md=256m -mqs=on -bso0 -bsp0 "$ARCHIVE" dist/MatchVehicleAI
          SIZE=$(wc -c < "$ARCHIVE")
          echo "$ARCHIVE is $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::warning::$ARCHIVE is $SIZE bytes -- back over the 2 GiB cap; splitting into parts as a fallback"
            split -b 1900m --numeric-suffixes=1 -a 1 "$ARCHIVE" "$ARCHIVE."
            rm "$ARCHIVE"  # the artifact/upload globs below must match only the parts
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchVehicleAI${{ matrix.suffix }}
          path: ${{ matrix.archive }}*
          if-no-files-found: error

      # Each leg attaches its own archive (or split parts if the fallback
      # fired); both end up on the same release page.
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}*
