name: Build Windows executables

# Two artifacts per run, built from one pinned environment
# (requirements-lock.txt + Python 3.14):
#
#   MatchVehicleAI-windows.zip      -- CPU-only torch; runs anywhere. Plain zip;
#                                      small enough not to care about format.
#   MatchVehicleAI-windows-cuda.7z  -- torch+cu126 wheels; GPU-accelerated
#                                      detection/embedding/OCR on any NVIDIA
#                                      driver >= 527.41 (CUDA-12 minor-version
#                                      compatibility), falls back to CPU code
#                                      paths otherwise. Roughly double the
#                                      download size because the CUDA DLLs are
#                                      bundled.
#
# Why the CUDA bundle is a single .7z and not a zip: GitHub caps every release
# asset at 2 GiB per file, and a plain zip of the CUDA tree is ~2.7 GiB -- it
# had to be byte-split into .zip.1/.zip.2 parts that users rejoined with
# "copy /b". 7z/LZMA2 (-mx=9, solid) compresses the highly repetitive cudnn /
# cublas DLLs far better than Deflate and lands the whole bundle under the cap
# as exactly ONE downloadable file. Extracting needs Windows 11 File Explorer
# (native .7z support), 7-Zip or WinRAR -- documented in the README.
#
# The app picks CUDA up on its own when torch reports it available, so the two
# builds differ only in which torch wheel went in -- same spec, same code.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release-attach step below creates a release and uploads assets to it,
# which needs contents:write -- the default token on push events is
# read-only, so without this the attach step dies with 403 "Resource not
# accessible by integration" (as v1.0.0's first build did).
permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"
  TORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  # Newest CUDA-12 wheel line: runs on driver >= 527.41. (+cu130 would need a
  # CUDA-13 driver, ~580.xx -- far too new to demand from users.)
  CUDA_TORCH_INDEX: "https://download.pytorch.org/whl/cu126"
  # uv provisions the thin installer's environment and is baked into it, so
  # it is pinned like everything else that ends up in a shipped artifact --
  # "latest" would mean two builds of the same tag could carry different
  # bytes. UV_SHA256 is the checksum astral-sh publishes beside the asset:
  # a version pin alone still trusts whatever the URL serves, and this is
  # the one binary here that is fetched from outside PyPI/pytorch.org.
  UV_VERSION: "0.12.5"
  UV_SHA256: "4c4d49d8738847d9b71ba319e49a5688c93eac0fe6204b1df24e98528dddf39a"

jobs:
  build:
    name: PyInstaller (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            # Default PyPI Windows wheels are CPU-only -- no extra index needed.
            torch_packages: "torch==2.13.0 torchvision==0.28.0"
            torch_index_args: ""
            suffix: "-windows"
            archive: "MatchVehicleAI-windows.zip"
          - flavor: cuda
            torch_packages: "torch==2.13.0+cu126 torchvision==0.28.0+cu126"
            torch_index_args: "--index-url https://download.pytorch.org/whl/cu126"
            suffix: "-windows-cuda"
            archive: "MatchVehicleAI-windows-cuda.7z"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Torch first, from its own index for the CUDA leg, so that installing
      # requirements-lock.txt afterwards sees torch/torchvision already
      # satisfied instead of pulling the CPU wheels as easyocr dependencies.
      - name: Install torch stack (${{ matrix.flavor }})
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.torch_packages }} ${{ matrix.torch_index_args }}

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      # Baked into the bundle as assets/_build_version.txt and read back at
      # runtime (--version flag, title bar, log line). Tag builds carry the
      # tag itself; manual runs get an increasing dev number so they can still
      # be told apart.
      - name: Stamp build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "$VER" > assets/_build_version.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Produces dist/MatchVehicleAI/ (a folder, not a single .exe) -- see the
      # header of tools/windows.spec for why onefile is the wrong shape here.
      - name: Build executable
        run: pyinstaller tools/windows.spec --noconfirm

      # The app imports torch, ultralytics, easyocr and cv2 lazily, so a
      # missing dependency would not surface until a user actually starts
      # processing. Force each one to import now, while we can still fail
      # the build, rather than shipping a package that only breaks in use.
      - name: Verify bundled dependencies
        run: dist/MatchVehicleAI/MatchVehicleAI.exe --selftest

      # Proves the stamp above survived packaging -- the exe must report the
      # built version, not fall back to "dev".
      - name: Check stamped version
        shell: bash
        run: |
          OUT=$(dist/MatchVehicleAI/MatchVehicleAI.exe --version)
          echo "exe reports: $OUT"
          [[ "$OUT" == *"MatchVehicleAI $(cat assets/_build_version.txt)" ]] || {
            echo "::error::exe did not report the stamped version"; exit 1; }

      # Size is this bundle's standing problem: torch alone is a couple of
      # hundred megabytes and the CUDA leg's cuDNN/cuBLAS DLLs push the tree
      # past 2 GiB, so what a user extracts is far larger than what they
      # downloaded. Trimming it has to be driven by measurement rather than
      # guesswork -- several plausible-sounding cuts (EasyOCR language packs,
      # UPX-compressing the DLLs) turn out to save nothing here, or to cost
      # more in startup time and memory than they save on disk.
      #
      # So every build publishes what it actually weighs, broken down far
      # enough to act on. The numbers land in the run summary next to each
      # other, which is also what makes a size regression visible as it lands
      # rather than months later in a bug report about disk usage.
      #
      # Note the sort-to-file-then-head shape below rather than the obvious
      # `sort | head`. Actions runs `shell: bash` with `set -eo pipefail`, so
      # once head has taken its 25 lines and closed the pipe, sort dies of
      # SIGPIPE and pipefail turns that into exit 141 -- failing the build on
      # a step that had already produced the right answer.
      - name: Report bundle size
        shell: bash
        # A size report is diagnostics, not a gate: nothing here can tell a
        # good build from a bad one, so it must never be what stops a release
        # from shipping.
        continue-on-error: true
        run: |
          BUNDLE=dist/MatchVehicleAI
          REPORT="$RUNNER_TEMP/sizes.txt"
          TOTAL=$(du -sm "$BUNDLE" | cut -f1)
          {
            echo "### Bundle size (${{ matrix.flavor }})"
            echo ""
            echo "Extracted on disk: **${TOTAL} MB**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # -d 2 reaches _internal/<package>, which is the level a decision to
          # exclude something is actually made at.
          du -m -d 2 "$BUNDLE" | sort -rn > "$REPORT"
          {
            echo "<details><summary>Largest bundled packages</summary>"
            echo ""
            echo '```'
            head -25 "$REPORT"
            echo '```'
            echo "</details>"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # -exec du rather than find's -printf: the latter is a GNU
          # extension, and `find` on a Windows runner is only GNU find as
          # long as Git's usr/bin keeps winning over System32\find.exe.
          find "$BUNDLE" -type f -exec du -m {} + | sort -rn > "$REPORT"
          {
            echo "<details><summary>Largest individual files</summary>"
            echo ""
            echo '```'
            head -25 "$REPORT"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # The CPU tree zips small (~350 MB); only the CUDA leg fights the cap.
      - name: Package CPU build (zip)
        if: matrix.flavor == 'cpu'
        run: Compress-Archive -Path dist/MatchVehicleAI `
            -DestinationPath "${{ matrix.archive }}"

      # GitHub caps every release asset at 2 GiB per file and a plain zip of
      # the CUDA tree is ~2.7 GiB (the cudnn/cublas DLLs dwarf everything
      # else), so this leg archives with 7z/LZMA2 instead: -mx=9 for max
      # effort, a 256 MiB dictionary so far-apart repeats in the multi-hundred-
      # MB DLLs still match, and a solid archive with -mqs=on to sort similar
      # files adjacently. Together that lands the bundle under the cap as ONE
      # downloadable file instead of split parts users had to rejoin with
      # "copy /b". Extracting needs Win11 File Explorer / 7-Zip / WinRAR.
      #
      # Safety net: if dependency growth ever pushes the .7z back over the cap,
      # byte-split it like before rather than failing the release -- with a
      # loud warning so the regression gets noticed. The parts rejoin with
      # "copy /b ...cuda.7z.1+...cuda.7z.2 ...cuda.7z".
      - name: Package CUDA build (single-file 7z under the 2 GiB asset cap)
        if: matrix.flavor == 'cuda'
        shell: bash
        run: |
          ARCHIVE="${{ matrix.archive }}"
          7z a -t7z -mx=9 -md=256m -mqs=on -bso0 -bsp0 "$ARCHIVE" dist/MatchVehicleAI
          SIZE=$(wc -c < "$ARCHIVE")
          echo "$ARCHIVE is $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::warning::$ARCHIVE is $SIZE bytes -- back over the 2 GiB cap; splitting into parts as a fallback"
            split -b 1900m --numeric-suffixes=1 -a 1 "$ARCHIVE" "$ARCHIVE."
            rm "$ARCHIVE"  # the artifact/upload globs below must match only the parts
          fi

      # The download and the install are two different numbers and users feel
      # both -- the archive is what they wait for, the extracted tree is what
      # occupies their disk afterwards. Reporting the pair together (and the
      # ratio between them) keeps that distinction in view: compression work
      # moves the first number only, and excluding a package moves both.
      - name: Report archive size
        shell: bash
        continue-on-error: true  # diagnostics, never a release gate
        run: |
          BUNDLE_MB=$(du -sm dist/MatchVehicleAI | cut -f1)
          {
            echo ""
            echo "| ${{ matrix.flavor }} | size |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # The glob covers the CUDA leg's split-parts fallback, where the
          # download is several files rather than one.
          for f in ${{ matrix.archive }}*; do
            MB=$(du -sm "$f" | cut -f1)
            echo "| download \`$f\` | ${MB} MB |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| extracted on disk | ${BUNDLE_MB} MB |" >> "$GITHUB_STEP_SUMMARY"

      # v6, skipping v5: every action here is held to the lowest major that
      # runs on Node 24, since Node 20 is deprecated on the runners. For
      # checkout that is v5 and for setup-python v6, but upload-artifact's
      # own v5 is still a Node 20 build, so this one has to go two majors to
      # clear the same bar.
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MatchVehicleAI${{ matrix.suffix }}
          path: ${{ matrix.archive }}*
          if-no-files-found: error

      # Each leg attaches its own archive (or split parts if the fallback
      # fired); both end up on the same release page.
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}*

  # A third artifact on the same release, for people who would rather wait
  # for the dependencies during setup than download them as a release asset:
  # tens of megabytes instead of 350 MB / 2.7 GiB, with uv fetching the same
  # pinned set from PyPI/pytorch.org while Setup runs, and the machine's own
  # driver deciding whether that is the CPU or the CUDA torch.
  #
  # It does NOT supersede the packaged builds. What lands on disk is the same
  # either way -- this route moves the download, it does not shrink it -- and
  # it trades CI-verified bytes for a resolve on the user's machine that
  # needs working internet. Offline, restricted, or air-gapped installs stay
  # on the zip/7z, which is why all three ship.
  installer:
    name: Inno Setup (thin installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cheap, and it is what stops the installer's pins from drifting away
      # from the packaged builds' -- see tests/test_installer_pins.py.
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest
          python -m pytest tests/ -q

      # Same stamp as the packaged legs. It ships inside assets/, which the
      # installer copies verbatim, so the installed app reports its version
      # the same way a frozen build does.
      - name: Stamp build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "$VER" > assets/_build_version.txt
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      # uv is the one dependency that cannot be fetched by the thing it
      # bootstraps, so it is baked into the installer -- which makes it
      # shipped bytes, and shipped bytes get pinned and verified. The
      # checksum is the part that matters: pinning the version fixes which
      # release is requested, but only comparing the hash establishes that
      # what arrived is that release. Note the tag carries no "v" prefix.
      - name: Fetch uv
        shell: bash
        run: |
          curl -fsSL -o uv.zip \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip"
          echo "${UV_SHA256}  uv.zip" | sha256sum -c - || {
            echo "::error::uv-${UV_VERSION} checksum mismatch -- refusing to build an installer around it"
            exit 1; }
          7z e -y uv.zip uv.exe > /dev/null
          test -f uv.exe
          # Confirms the pin end to end: a zip whose hash matched but whose
          # contents were built from another revision would surface here.
          echo "uv reports: $(./uv.exe --version)" >> "$GITHUB_STEP_SUMMARY"
          ./uv.exe --version | grep -q "${UV_VERSION}" || {
            echo "::error::uv.exe does not report ${UV_VERSION}"; exit 1; }

      # Inno Setup ships on the windows runner image, but the install path
      # has moved between image versions -- resolve it rather than hardcode.
      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" `
                    -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
                      Select-Object -First 1
          }
          # Printed before compiling, not after: when ISCC rejects the script
          # the useful half of the diagnosis is which Inno it was -- several
          # directives the script relies on (x64compatible among them) exist
          # only from 6.3 onward, and the runner image's version moves.
          Write-Host "ISCC: $($iscc.FullName)"
          & $iscc.FullName /? 2>&1 | Select-Object -First 2
          & $iscc.FullName /DAppVersion=${{ steps.version.outputs.value }} `
              tools\installer\MatchVehicleAI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # The reason a thin installer is defensible at all. The packaged legs
      # prove their bundle by running --selftest on the tree they are about
      # to ship; an installer whose environment is resolved on the user's
      # machine has no such guarantee, so CI performs a real silent install
      # here and then exercises what it produced. Without this step the first
      # person to run the installer would be the first person to test it.
      - name: Install it, for real
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\mvai"
          $proc = Start-Process -FilePath ".\MatchVehicleAI-windows-installer.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target",`
                          "/LOG=$env:RUNNER_TEMP\setup.log" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 80
            throw "Setup exited with $($proc.ExitCode)"
          }
          # Setup reports provisioning failure through a message box, which
          # /SUPPRESSMSGBOXES swallows -- so a silent install can "succeed"
          # with no environment. Check for the environment itself rather than
          # trusting the exit code.
          $py = "$target\env\Scripts\python.exe"
          if (-not (Test-Path $py)) {
            Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 80
            throw "Setup finished but built no Python environment"
          }
          & $py "$target\tools\pyinstaller_entry.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw "the installed app failed its self-test" }

      # Proves the stamp survived the installer the same way the packaged
      # legs prove it survived PyInstaller.
      - name: Check stamped version
        shell: bash
        run: |
          OUT=$("$RUNNER_TEMP/mvai/env/Scripts/python.exe" \
                "$RUNNER_TEMP/mvai/tools/pyinstaller_entry.py" --version)
          echo "installed app reports: $OUT"
          [[ "$OUT" == *"MatchVehicleAI ${{ steps.version.outputs.value }}"* ]] || {
            echo "::error::the installed app did not report the stamped version"; exit 1; }

      # The number this artifact exists for, next to what it actually costs
      # once installed -- the two differ by more than an order of magnitude
      # here, which is the whole point and also the thing most likely to be
      # misread.
      - name: Report installer size
        shell: bash
        continue-on-error: true  # diagnostics, never a release gate
        run: |
          DOWNLOAD=$(du -sm MatchVehicleAI-windows-installer.exe | cut -f1)
          INSTALLED=$(du -sm "$RUNNER_TEMP/mvai" | cut -f1)
          {
            echo ""
            echo "| thin installer | size |"
            echo "|---|---|"
            echo "| download | ${DOWNLOAD} MB |"
            echo "| installed on disk (CPU torch) | ${INSTALLED} MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MatchVehicleAI-windows-installer
          path: MatchVehicleAI-windows-installer.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: MatchVehicleAI-windows-installer.exe
