name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the version the executables are built with (see
        # build-windows.yml) and what development runs on -- it must stay
        # green. 3.12 guards the compatibility floor.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The unit tests exercise only the pure-logic layers (matcher, frame
      # loader). Heavy ML deps (torch, ultralytics, opencv) are deferred
      # imports and never touched by the tests, so we install just what the
      # tests need — keeping CI fast and reliable.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest

      - name: Run tests
        run: python -m pytest tests/ -v
